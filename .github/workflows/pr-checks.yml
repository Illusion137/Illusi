name: PR Checks

on:
    pull_request:
        branches: [main, dev]

jobs:
    checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Type check
              run: yarn ts:check

            - name: Lint
              run: yarn lint
